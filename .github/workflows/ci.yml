name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  GO_VERSION: "1.26.4"
  PULUMI_SKIP_UPDATE_CHECK: "true"

jobs:
  go:
    name: go build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make build
      - run: make test
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
        continue-on-error: true

  integration:
    name: go integration (real providers)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: cache pulumi plugins
        uses: actions/cache@v4
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-${{ runner.os }}-${{ hashFiles('engine/integration_test.go') }}
      - run: make integration

  lib:
    name: libpulumi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: go
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: macos-14
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make lib
      - run: go test ./capi/... -count=1
      - uses: actions/upload-artifact@v4
        with:
          name: libpulumi-${{ matrix.platform }}
          path: build/libpulumi.*

  node:
    name: node binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: go
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bindings/nodejs/pnpm-lock.yaml
      - name: cache pulumi plugins
        uses: actions/cache@v4
        with:
          path: ~/.pulumi/plugins
          key: pulumi-plugins-node-${{ runner.os }}
      - run: make node
