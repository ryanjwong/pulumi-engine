name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  GO_VERSION: "1.26.4"
  # The CLI the parity tests run against; keep equal to the pkg/v3 pin in go.mod.
  PULUMI_CLI_VERSION: "3.237.0"
  PULUMI_SKIP_UPDATE_CHECK: "true"
  # Pulumi's plugin installer authenticates GitHub release downloads with
  # GITHUB_TOKEN when set (sdk workspace/plugins.go), which lifts the
  # anonymous rate limit that made plugin downloads flaky.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # One plugin cache for every job; the cache key is shared so a job restores
  # what another saved (Pulumi's cache is keyed by plugin name and version).
  PULUMI_PLUGIN_CACHE_KEY: pulumi-plugins-v2

jobs:
  go:
    name: go build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make build
      - run: make test
      - run: make upstream-check
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
        continue-on-error: true

  integration:
    name: go integration (real providers)
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: install the pulumi CLI (for the parity tests)
        uses: pulumi/actions@v6
        with:
          pulumi-version: ${{ env.PULUMI_CLI_VERSION }}
      - name: cache pulumi plugins
        uses: actions/cache@v4
        with:
          path: ~/.pulumi/plugins
          key: ${{ env.PULUMI_PLUGIN_CACHE_KEY }}-${{ runner.os }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bindings/nodejs/pnpm-lock.yaml
      - name: install the Node SDK (for the language-host env test)
        run: make node-install
      - run: make integration

  lib:
    name: libpulumi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: go
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: macos-14
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make lib
      - run: make abitest
      - uses: actions/upload-artifact@v4
        with:
          name: libpulumi-${{ matrix.platform }}
          path: build/libpulumi.*

  node:
    name: node binding (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: go
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bindings/nodejs/pnpm-lock.yaml
      - name: install the pulumi CLI (for the parity tests)
        uses: pulumi/actions@v6
        with:
          pulumi-version: ${{ env.PULUMI_CLI_VERSION }}
      - name: cache pulumi plugins
        uses: actions/cache@v4
        with:
          path: ~/.pulumi/plugins
          key: ${{ env.PULUMI_PLUGIN_CACHE_KEY }}-${{ runner.os }}
      - run: make node
